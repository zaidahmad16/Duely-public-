<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'" />
    <title>Duely</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Temporary setup panel (P2). The real wizard, Upcoming and Settings come in P3. -->
    <main id="app">
      <h1>Duely</h1>
      <p id="summary" class="muted">Loading…</p>
      <p id="warn" class="warn" hidden></p>

      <section>
        <h2>1. Brightspace calendar link</h2>
        <form id="feed"><input id="feed-url" type="url" placeholder="webcal://…/feed.ics?token=…" required /><button>Save</button></form>
        <p id="feed-state" class="muted"></p>
      </section>

      <section>
        <h2>2. Google Calendar</h2>
        <p class="muted">Pick the client JSON you downloaded from Google Cloud (a “Desktop app” client). Duely only sees the one calendar it creates.</p>
        <input id="client" type="file" accept=".json,application/json" />
        <button id="google">Connect Google</button> <button id="disconnect" hidden>Disconnect</button>
        <p id="google-state" class="muted"></p>
      </section>

      <section>
        <h2>3. Sync</h2>
        <button id="sync">Sync now</button>
        <p id="sync-state" class="muted"></p>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
